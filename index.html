const QUICKNOTE_COLORS = ['#FFF8D6','#FFE9DC','#FFE0EC','#EEE6FF','#DDF1FF','#D8F6E1','#FFF0C7','#E3F8ED'];
function quickNoteColor(id){
  let hash = 0;
  for(let i=0;i<id.length;i++) hash = (hash*31 + id.charCodeAt(i)) % QUICKNOTE_COLORS.length;
  return QUICKNOTE_COLORS[Math.abs(hash)];
}
function quickNoteHash(id){
  let hash = 0;
  for(let i=0;i<id.length;i++) hash = (hash*17 + id.charCodeAt(i)) % 1000;
  return Math.abs(hash);
}
function quickNoteCardHtml(n, entering){
  const hash = quickNoteHash(n.id);
  const variant = (hash % 6) + 1;
  const delay = -((hash % 9) / 6);
  const widthPct = 78 + (hash % 23);
  const d = new Date(n.createdAt);
  const pad = x=>String(x).padStart(2,'0');
  const label = `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const innerStyle = entering
    ? `background:${quickNoteColor(n.id)};animation-name:quicknoteAppear,windSway${variant};animation-duration:.5s,45s;animation-timing-function:ease-out,ease-in-out;animation-iteration-count:1,infinite;animation-fill-mode:both,none;animation-delay:0s,${delay}s;`
    : `background:${quickNoteColor(n.id)};animation-name:windSway${variant};animation-delay:${delay}s;`;
  return `<div class="quicknote-card" data-note-id="${n.id}" style="width:${widthPct}%">
    <div class="quicknote-inner" style="${innerStyle}">
      <span class="quicknote-pin"></span>
      <button class="quicknote-del" onclick="deleteQuickNote('${n.id}')">×</button>
      <button class="quicknote-move" onclick="openMoveNoteModal('${n.id}')">移至</button>
      <div class="quicknote-text">${escapeHtml(n.text)}</div>
      <div class="quicknote-time">${label}</div>
    </div>
  </div>`;
}
let leafTimer = null;
let draggingLeaf = null;
let dragOffsetX = 0, dragOffsetY = 0;
function spawnLeaf(){
  const layer = document.getElementById('quickNoteLeafLayer');
  if(!layer) return;
  if(layer.children.length >= 3) return;
  const leaf = document.createElement('div');
  leaf.className = 'quicknote-leaf';
  const topPct = 5 + Math.random()*70;
  const dur = 6 + Math.random()*4;
  const dx = -(110 + Math.random()*15);
  const dy = 60 + Math.random()*120;
  const drot = 250 + Math.random()*260;
  leaf.style.top = topPct + '%';
  leaf.style.setProperty('--dx', dx+'vw');
  leaf.style.setProperty('--dy', dy+'px');
  leaf.style.setProperty('--drot', drot+'deg');
  leaf.style.animationDuration = dur+'s';
  leaf.innerHTML = `<svg viewBox="0 0 30 20" width="26" height="18"><path d="M2 10 Q8 0 28 2 Q22 12 15 18 Q6 18 2 10Z" fill="#8FAE7A"/><path d="M3 10 Q14 8 27 3" stroke="#6E8F5C" stroke-width="1" fill="none" opacity="0.6"/></svg>`;
  const onAnimEnd = ()=> leaf.remove();
  leaf._onAnimEnd = onAnimEnd;
  leaf.addEventListener('animationend', onAnimEnd);
  leaf.addEventListener('mousedown', (e)=> startDragLeaf(e, leaf));
  leaf.addEventListener('touchstart', (e)=> startDragLeaf(e, leaf), {passive:false});
  layer.appendChild(leaf);
}
function startDragLeaf(e, leaf){
  if(leaf.__caught) return;
  e.preventDefault();
  leaf.__caught = true;
  if(leaf._onAnimEnd){ leaf.removeEventListener('animationend', leaf._onAnimEnd); leaf._onAnimEnd = null; }
  const layer = document.getElementById('quickNoteLeafLayer');
  const layerRect = layer.getBoundingClientRect();
  const rect = leaf.getBoundingClientRect();
  leaf.style.animation = 'none';
  leaf.style.right = 'auto';
  leaf.style.left = (rect.left - layerRect.left) + 'px';
  leaf.style.top = (rect.top - layerRect.top) + 'px';
  leaf.style.transform = 'none';
  leaf.style.opacity = '1';
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  dragOffsetX = clientX - rect.left;
  dragOffsetY = clientY - rect.top;
  draggingLeaf = leaf;
}
document.addEventListener('mousemove', onLeafDragMove);
document.addEventListener('touchmove', onLeafDragMove, {passive:false});
document.addEventListener('mouseup', onLeafDragRelease);
document.addEventListener('touchend', onLeafDragRelease);
function onLeafDragMove(e){
  if(!draggingLeaf) return;
  e.preventDefault();
  const layer = document.getElementById('quickNoteLeafLayer');
  const layerRect = layer.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const x = clientX - dragOffsetX - layerRect.left;
  const y = clientY - dragOffsetY - layerRect.top;
  draggingLeaf.style.left = x + 'px';
  draggingLeaf.style.top = y + 'px';
}
function onLeafDragRelease(){
  if(!draggingLeaf) return;
  const leaf = draggingLeaf;
  draggingLeaf = null;
  releaseLeaf(leaf);
}
function releaseLeaf(leaf){
  leaf.__caught = false;
  const layer = document.getElementById('quickNoteLeafLayer');
  const layerRect = layer.getBoundingClientRect();
  let x = parseFloat(leaf.style.left) || 0;
  let y = parseFloat(leaf.style.top) || 0;
  let vx = 0;
  let vy = 0;
  const gravity = 130;
  const vyDrag = 3;
  const windAccel = -260;
  const maxVx = -150;
  const windStartDelay = 0.5;
  let bounced = false;
  const leafH = leaf.offsetHeight || 18;
  const groundY = layerRect.height - leafH - 2;
  let lastT = performance.now();
  let elapsed = 0;

  function step(now){
    if(leaf.__caught) return;
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    elapsed += dt;
    vy += (gravity - vyDrag * vy) * dt;
    if(elapsed >= windStartDelay){
      vx += windAccel * dt;
      if(vx < maxVx) vx = maxVx;
    }
    x += vx * dt;
    y += vy * dt;
    if(y >= groundY){
      y = groundY;
      vy = 0;
      if(!bounced){ vx = vx / 2; bounced = true; }
    }
    leaf.style.left = x + 'px';
    leaf.style.top = y + 'px';
    if(x < -60 || x > layerRect.width + 60){
      leaf.remove();
      return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function maybeShowDailyBrief(){

    persist();
  }
  showDailyBrief(showGreeting);
  return true;
}
function showDailyBrief(withGreeting){
  const day = todayStr();
  const dueTasks = data.tasks.filter(t=> t.status!=='done' && t.dueDate && t.dueDate<=day);
  const todaySubtasks = [];
  data.tasks.forEach(t=>{
    (t.subtasks||[]).forEach(s=>{
      if(s.status!=='done' && s.time && s.time.slice(0,10)===day) todaySubtasks.push(s);
    });
  });
  const pendingHabits = data.habits.filter(h=> !habitHasLog(h, day));

  let html = `<h2 style="margin:0 0 16px;font-size:18px;">今天要做的事</h2>`;
  if(dueTasks.length===0 && todaySubtasks.length===0 && pendingHabits.length===0){
    html += `<p class="brief-empty">今天沒有排定的事項，輕鬆的一天！</p>`;
  }else{
    if(dueTasks.length) html += `<div class="brief-section"><div class="brief-label">到期或逾期的事項</div>${dueTasks.map(t=>`<div class="brief-item">${escapeHtml(t.title)}</div>`).join('')}</div>`;
    if(todaySubtasks.length) html += `<div class="brief-section"><div class="brief-label">今天的細項</div>${todaySubtasks.map(s=>`<div class="brief-item">${escapeHtml(s.title)}</div>`).join('')}</div>`;
    if(pendingHabits.length) html += `<div class="brief-section"><div class="brief-label">今天還沒打卡的習慣</div>${pendingHabits.map(h=>`<div class="brief-item">${escapeHtml(h.name)}</div>`).join('')}</div>`;
  }
  document.getElementById('dailyBriefContent').innerHTML = html;

  const overlay = document.getElementById('dailyBriefOverlay');
  const greetScreen = document.getElementById('morningGreetingScreen');
  const contentCard = document.getElementById('dailyBriefContentCard');
  greetScreen.classList.remove('fade-out');
  contentCard.classList.remove('show-card');
  overlay.classList.toggle('plain-mode', !withGreeting);
  overlay.classList.remove('sky-cycle');
  if(withGreeting){
    greetScreen.style.display = 'flex';
    contentCard.style.display = 'none';
    requestAnimationFrame(()=> requestAnimationFrame(()=> overlay.classList.add('sky-cycle')));
  }else{
    greetScreen.style.display = 'none';
    contentCard.style.display = 'block';
    requestAnimationFrame(()=> requestAnimationFrame(()=> contentCard.classList.add('show-card')));
  }
  overlay.classList.add('show');
}
function viewDailyBriefNow(){
  showDailyBrief(false);
}
function advanceFromMorningGreeting(){
  const greetScreen = document.getElementById('morningGreetingScreen');
  const contentCard = document.getElementById('dailyBriefContentCard');
  const overlay = document.getElementById('dailyBriefOverlay');
  greetScreen.classList.add('fade-out');
  overlay.classList.remove('sky-cycle');
  setTimeout(()=>{
    greetScreen.style.display = 'none';
    contentCard.style.display = 'block';
    requestAnimationFrame(()=> requestAnimationFrame(()=> contentCard.classList.add('show-card')));
  }, 500);
}
function closeDailyBrief(){
  const overlay = document.getElementById('dailyBriefOverlay');
  overlay.classList.add('fading-out');
  overlay.classList.remove('sky-cycle');
  setTimeout(()=>{
    overlay.classList.remove('show','fading-out');
  }, 500);
}

/* ============================================================
   今天總結（夜間回顧）
============================================================ */
function getRecapDateStr(){
  const hour = new Date().getHours();
  return hour >= 22 ? todayStr() : dateStrOffset(-1);
}
function getRecapLabel(){
  const hour = new Date().getHours();
  return (hour >= 22 || hour < 4) ? '今天' : '昨天';
}
function isNightRecapWindow(){
  const hour = new Date().getHours();
  return hour >= 22 || hour < 10;
}
function maybeShowNightRecap(){
  if(!isNightRecapWindow()) return false;
  const recapDay = getRecapDateStr();
  if(data.lastAutoRecapDate === recapDay) return false;
  data.lastAutoRecapDate = recapDay;
  persist();
  showNightRecap(recapDay);
  return true;
}

let recapTargetDate = null;
let recapSelectedMood = null;
function buildRecapSummaryHtml(day){
  const doneItems = [];
  const undoneItems = [];
  const overdueItems = [];
  data.tasks.forEach(t=>{
    if(t.status==='done') doneItems.push(t.title);
    else if(t.dueDate && t.dueDate < day) overdueItems.push(t.title);
    else if(t.dueDate === day) undoneItems.push(t.title);
    (t.subtasks||[]).forEach(s=>{
      if(!s.time) return;
      const sDay = s.time.slice(0,10);
      if(sDay !== day) return;
      if(s.status==='done') doneItems.push(s.title);
      else undoneItems.push(s.title);
    });
  });
  let html = '';
  html += `<div class="brief-section"><div class="brief-label">今天完成了</div>` +
    (doneItems.length? doneItems.map(x=>`<div class="brief-item">${escapeHtml(x)}</div>`).join('') : `<div class="brief-item" style="color:var(--ink-soft)">今天沒有完成的項目</div>`) + `</div>`;
  if(undoneItems.length){
    html += `<div class="brief-section"><div class="brief-label">還沒做</div>` +
      undoneItems.map(x=>`<div class="brief-item">${escapeHtml(x)}</div>`).join('') + `</div>`;
  }
  if(overdueItems.length){
    html += `<div class="brief-section"><div class="brief-label" style="color:var(--danger)">已經延誤</div>` +
      overdueItems.map(x=>`<div class="brief-item" style="color:var(--danger)">${escapeHtml(x)}</div>`).join('') + `</div>`;
  }
  return html;
}
function showNightRecap(day, isManual){
  recapTargetDate = day;
  recapSelectedMood = null;
  if(!data.dayRecaps) data.dayRecaps = {};
  const existing = data.dayRecaps[day];
  document.getElementById('recapTitle').textContent = (isManual? '' : getRecapLabel()) + '總結';
  document.getElementById('recapSummaryContent').innerHTML = buildRecapSummaryHtml(day);
  const s1 = document.getElementById('recapStep1');
  const s2 = document.getElementById('recapStep2');
  s1.classList.remove('fade-out','fade-in-init');
  s2.classList.remove('fade-out','fade-in-init');
  s1.style.display = 'block';
  s2.style.display = 'none';
  document.getElementById('recapNoteInput').value = existing ? (existing.note||'') : '';
  document.querySelectorAll('.mood-btn').forEach(b=> b.classList.toggle('selected', !!existing && existing.mood===b.dataset.mood));
  if(existing) recapSelectedMood = existing.mood;
  const overlay = document.getElementById('nightRecapOverlay');
  const card = document.getElementById('recapCard');
  card.classList.remove('closing','fade-out-card');
  card.style.display = 'block';
  card.style.height = '';
  card.style.transition = '';
  document.getElementById('recapGoodnightScreen').classList.remove('show');
  document.getElementById('recapGoodnightScreen').style.display = 'none';
  overlay.classList.add('show');
}
function nightRecapNextStep(){
  const card = document.getElementById('recapCard');
  const s1 = document.getElementById('recapStep1');
  const s2 = document.getElementById('recapStep2');
  card.style.height = card.offsetHeight + 'px';
  s1.classList.add('fade-out');
  setTimeout(()=>{
    s1.style.display = 'none';
    s2.style.display = 'block';
    const endHeight = card.scrollHeight;
    card.style.transition = 'height 1s ease';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ card.style.height = endHeight + 'px'; }));
    s2.classList.add('fade-in-init');
    requestAnimationFrame(()=> requestAnimationFrame(()=> s2.classList.remove('fade-in-init')));
    setTimeout(()=>{ card.style.height=''; card.style.transition=''; }, 1000);
  }, 1000);
}
function selectMood(mood){
  recapSelectedMood = mood;
  document.querySelectorAll('.mood-btn').forEach(b=>{
    const isSel = b.dataset.mood===mood;
    b.classList.toggle('selected', isSel);
    if(isSel){
      b.classList.remove('bounce');
      requestAnimationFrame(()=>{
        b.classList.add('bounce');
        setTimeout(()=> b.classList.remove('bounce'), 350);
      });
    }
  });
}
function saveNightRecap(){
  const note = document.getElementById('recapNoteInput').value.trim();
  if(!data.dayRecaps) data.dayRecaps = {};
  data.dayRecaps[recapTargetDate] = { mood: recapSelectedMood, note, createdAt: Date.now() };
  persist();
  showGoodnightScreen();
}
function showGoodnightScreen(){
  const card = document.getElementById('recapCard');
  card.classList.add('fade-out-card');
  setTimeout(()=>{
    card.style.display = 'none';
    const screen = document.getElementById('recapGoodnightScreen');
    screen.style.display = 'flex';
    requestAnimationFrame(()=> requestAnimationFrame(()=> screen.classList.add('show')));
  }, 1000);
}
function closeFromGoodnight(){
  const overlay = document.getElementById('nightRecapOverlay');
  const screen = document.getElementById('recapGoodnightScreen');
  overlay.classList.add('fading-out');
  screen.classList.remove('show');
  setTimeout(()=>{
    overlay.classList.remove('show','fading-out');
    screen.style.display = 'none';
    if(pendingMorningBriefAfterRecap){
      pendingMorningBriefAfterRecap = false;
      maybeShowDailyBrief();
    }
  }, 1000);
}
function closeNightRecap(){
  const overlay = document.getElementById('nightRecapOverlay');
  overlay.classList.add('fading-out');
  setTimeout(()=>{
    overlay.classList.remove('show','fading-out');
    if(pendingMorningBriefAfterRecap){
      pendingMorningBriefAfterRecap = false;
      maybeShowDailyBrief();
    }
  }, 1000);
}
function openRecapFromWeek(day){
  showNightRecap(day, true);
}
function dismissDailyBriefToday(){
  data.dailyBriefDismissedDate = todayStr();
  persist();
  updateDailyBriefSwitch();
  closeDailyBrief();
}
function updateDailyBriefSwitch(){
  const sw = document.getElementById('dailyBriefSwitch');
  if(!sw) return;
  const isOn = data.dailyBriefDismissedDate !== todayStr();
  sw.classList.toggle('on', isOn);
}
function updateMorningGreetingSwitch(){
  const sw = document.getElementById('morningGreetingSwitch');
  if(!sw) return;
  const dailyOff = data.dailyBriefDismissedDate === todayStr();
  sw.classList.toggle('on', !dailyOff && !!data.morningGreetingAlwaysOn);
  sw.classList.toggle('disabled', dailyOff);
}
function toggleMorningGreetingSwitch(){
  if(data.dailyBriefDismissedDate === todayStr()){
    notify('請先開啟每日提醒');
    return;
  }
  data.morningGreetingAlwaysOn = !data.morningGreetingAlwaysOn;
  persist();
  updateMorningGreetingSwitch();
}
function toggleDailyBriefSwitch(){
  const today = todayStr();
  if(data.dailyBriefDismissedDate === today){
    data.dailyBriefDismissedDate = null;
    persist();
    updateDailyBriefSwitch();
    updateMorningGreetingSwitch();
  }else{
    data.dailyBriefDismissedDate = today;
    data.morningGreetingAlwaysOn = false;
    persist();
    updateDailyBriefSwitch();
    updateMorningGreetingSwitch();
  }
}

function openSummary(range){
  document.getElementById('summaryWeekBtn').classList.toggle('active', range==='week');
  document.getElementById('summaryMonthBtn').classList.toggle('active', range==='month');
  const days = range==='week' ? 7 : 30;
  const rangeLabel = range==='week' ? '本週' : '本月';
  const dateList = [];
  for(let i=days-1;i>=0;i--) dateList.push(dateStrOffset(-i));

  let completedTasks = 0;
  data.tasks.forEach(t=>{
    if(t.status==='done') completedTasks++;
    (t.subtasks||[]).forEach(s=>{
      if(s.status==='done' && s.time && dateList.includes(s.time.slice(0,10))) completedTasks++;
    });
  });

  const habitRows = data.habits.map(h=>{
    const doneDays = dateList.filter(d=> habitHasLog(h,d)).length;
    const rate = Math.round((doneDays/days)*100);
    return {name:h.name, rate};
  });
  const avgRate = habitRows.length ? Math.round(habitRows.reduce((s,h)=>s+h.rate,0)/habitRows.length) : 0;

  const noteCount = data.quickNotes.filter(n=>{
    const d = new Date(n.createdAt);
    const pad=x=>String(x).padStart(2,'0');
    const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    return dateList.includes(ds);
  }).length;

  let html = `<h2 style="margin:0 0 16px;font-size:18px;">${rangeLabel}小結</h2>`;
  html += `<div class="brief-section"><div class="brief-item">完成了 <b>${completedTasks}</b> 項事項／細項</div></div>`;
  html += `<div class="brief-section"><div class="brief-item">寫了 <b>${noteCount}</b> 則隨手記</div></div>`;
  if(habitRows.length){
    html += `<div class="brief-section"><div class="brief-label">習慣平均達成率 ${avgRate}%</div>` +
      habitRows.map(h=>`
        <div class="rate-row">
          <span class="rate-label">${escapeHtml(h.name)}</span>
          <div class="rate-bar-track"><div class="rate-bar-fill" data-target="${h.rate}" style="width:0%"></div></div>
          <span class="rate-value">${h.rate}%</span>
        </div>`).join('') + `</div>`;
  }
  document.getElementById('summaryContent').innerHTML = html;
  document.getElementById('summaryOverlay').classList.add('show');
  animateRateBars(document.getElementById('summaryContent'));
}
function closeSummary(){
  document.getElementById('summaryOverlay').classList.remove('show');
}

/* ============================================================
   書籤
============================================================ */
function renderBookmarks(){
  const grid = document.getElementById('bmGrid');
  grid.innerHTML = data.bookmarks.map(b=>{
    let domain=''; try{ domain = new URL(b.url).hostname; }catch(e){ domain=''; }
    const icon = domain ? `https://www.google.com/s2/favicons?domain=${domain}&sz=64` : '';
    return `<div class="bm-card">
      <button class="bm-del" onclick="deleteBookmark('${b.id}')">刪除</button>
      <a href="${escapeAttr(b.url)}" target="_blank" rel="noopener">
        ${icon? `<img src="${icon}">` : ''}
        <span class="bm-title">${escapeHtml(b.title)}</span>
      </a>
    </div>`;
  }).join('') + `<button class="bm-add-card" onclick="document.getElementById('bmModal').classList.add('show')">＋ 新增書籤</button>`;
}
function saveBookmark(){
  const title = document.getElementById('bmTitle').value.trim();
  let url = document.getElementById('bmUrl').value.trim();
  if(!title || !url) return;
  if(!/^https?:\/\//i.test(url)) url = 'https://'+url;
  data.bookmarks.push({id:uid(), title, url});
  document.getElementById('bmTitle').value=''; document.getElementById('bmUrl').value='';
  closeModal('bmModal');
  persist(); renderBookmarks();
}
function deleteBookmark(id){
  const idx = data.bookmarks.findIndex(b=>b.id===id);
  const removed = data.bookmarks[idx];
  data.bookmarks.splice(idx,1);
  renderBookmarks();
  showUndoToast('已刪除書籤「'+removed.title+'」', ()=>{
    data.bookmarks.splice(idx,0,removed);
  }, renderBookmarks);
}

/* ============================================================
   設定 / 配色風格
============================================================ */
function getPaletteById(id){
  return PRESET_PALETTES.find(p=>p.id===id) || (data.customPalettes||[]).find(p=>p.id===id);
}
function effectivePalette(){
  let pid = null;
  if(ui.catId !== 'overview'){
    const cat = categoryOf(ui.catId);
    if(cat && cat.paletteId) pid = cat.paletteId;
  }
  if(!pid) pid = data.globalPaletteId || 'p01';
  return getPaletteById(pid) || PRESET_PALETTES[0];
}
function applyTheme(){
  const p = effectivePalette();
  document.documentElement.style.setProperty('--bg', p.bg);
  document.documentElement.style.setProperty('--ink', p.ink);
  document.documentElement.style.setProperty('--accent', p.accent);
  document.documentElement.style.setProperty('--accent-soft', p.accent+'22');
}
function renderSettings(){
  const allPalettes = PRESET_PALETTES.concat(data.customPalettes||[]);
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = allPalettes.map(p=>`
    <button class="palette-card ${data.globalPaletteId===p.id?'selected':''}" onclick="setGlobalPalette('${p.id}')">
      <div class="palette-swatch"><span style="background:${p.bg}"></span><span style="background:${p.ink}"></span><span style="background:${p.accent}"></span></div>
      <div class="palette-name">${escapeHtml(p.name)}</div>
    </button>`).join('')
    + `<button class="palette-card add-card" onclick="document.getElementById('paletteModal').classList.add('show')">＋ 新增風格</button>`;

  const catBox = document.getElementById('categoryPaletteList');
  catBox.innerHTML = data.categories.map(c=>`
    <div class="cat-palette-row">
      <span>${escapeHtml(c.name)}</span>
      <select onchange="setCategoryPalette('${c.id}', this.value)">
        <option value="">跟隨整體配色</option>
        ${allPalettes.map(p=>`<option value="${p.id}" ${c.paletteId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
      </select>
    </div>`).join('');
}
function setGlobalPalette(id){
  data.globalPaletteId = id;
  applyTheme(); persist(); renderSettings();
}
function setCategoryPalette(catId, paletteId){
  const c = categoryOf(catId);
  c.paletteId = paletteId || null;
  if(ui.catId===catId) applyTheme();
  persist(); renderSettings();
}
function saveCustomPalette(){
  const name = document.getElementById('pName').value.trim();
  if(!name){ notify('請輸入風格名稱'); return; }
  const bg = document.getElementById('pBg').value;
  const ink = document.getElementById('pInk').value;
  const accent = document.getElementById('pAccent').value;
  if(!data.customPalettes) data.customPalettes = [];
  data.customPalettes.push({id:'custom-'+uid(), name, bg, ink, accent});
  document.getElementById('pName').value='';
  closeModal('paletteModal');
  persist(); renderSettings();
}
function resetTheme(){
  data.globalPaletteId = 'p01';
  data.categories.forEach(c=> c.paletteId = null);
  applyTheme(); persist(); renderSettings();
}
function clearAllDataConfirm(){
  showConfirm('確定要清除所有資料嗎？所有事項、習慣、書籤、自訂分類與配色都會被清空，只保留最基本的預設內容，此動作無法復原。', ()=>{
    data = defaultData();
    lastPersistedCount = 0;
    lastPersistedCounts = {tasks:0, habits:0, quickNotes:0, dayRecaps:0};
    ui.expanded = {}; ui.selectedDate = null; ui.habitDate = null; ui.habitWeekOffset = 0; ui.catId = 'overview'; ui.filter = 'all';
    applyTheme();
    persist();
    renderTabs();
    switchMainView('list');
  });
}


/* ============================================================
   工具 / 初始化
============================================================ */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function renderAll(){
  renderTabs();
  switchMainView('habits');
  scheduleHabitReminders();
}
