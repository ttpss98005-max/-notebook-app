<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事簿</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A6B5E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記事簿">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="dns-prefetch" href="https://accounts.google.com">
<script>window.__gsiLoaded = false;</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gsiLoaded = true; if(window.initGoogleSignIn) window.initGoogleSignIn();"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging-compat.js"></script>
<style>
  :root{
    --bg:#FAFAFA;
    --surface:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#8A8A8A;
    --accent:#3A6B5E;
    --accent-soft:#EAF1EF;
    --border:#E4E4E4;
    --danger:#E0685A;
    --shadow-sm:0 2px 8px rgba(30,30,30,.06);
    --shadow-md:0 4px 16px rgba(30,30,30,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Heiti TC",sans-serif;
    background:var(--bg);color:var(--ink);
  }
  button,input,select{font-family:inherit;}
  button{cursor:pointer;}

  /* ============ 登入 / 第一層浮現 ============ */
  #blackScreen{
    position:fixed;inset:0;background:var(--accent-soft);z-index:100;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .5s ease, background .3s ease;
  }
  #blackScreen.fade-out{opacity:0;pointer-events:none;}

  .stage{
    background:#fff;border-radius:26px;padding:44px 40px;max-width:360px;width:88%;
    text-align:center;opacity:0;transform:translateY(6px);
    box-shadow:var(--shadow-md);
    transition:opacity .4s ease, transform .4s ease;
  }
  .stage.show{opacity:1;transform:translateY(0);}
  .stage h1{font-size:22px;font-weight:700;margin:0 0 22px;letter-spacing:.5px;}

  @keyframes loginDotBounce{ 0%,80%,100%{transform:translateY(0);opacity:.6;} 40%{transform:translateY(-12px);opacity:1;} }
  .login-anim{display:flex;justify-content:center;gap:8px;margin:0 0 24px;}
  .login-anim span{width:11px;height:11px;border-radius:50%;background:var(--accent);display:block;
    animation:loginDotBounce 1.1s ease-in-out infinite;}
  .login-anim span:nth-child(2){animation-delay:.15s;}
  .login-anim span:nth-child(3){animation-delay:.3s;}

  .login-note{margin-top:22px;font-size:11px;color:#B5B5B5;line-height:1.7;text-align:left;background:#FAFAF7;border-radius:14px;padding:12px 14px;}

  /* ============ APP SHELL ============ */
  #appShell{display:none;min-height:100vh;}

  .top-bar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);
    padding:14px 26px;z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{font-size:16px;font-weight:700;letter-spacing:1px;flex-shrink:0;}
  .search-trigger-btn{margin-left:auto;background:#F1F0EA;border:none;width:34px;height:34px;border-radius:50%;
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
  .search-result-group{margin-bottom:16px;}
  .search-result-label{font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .search-result-item{padding:10px 8px;border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer;}
  .search-result-item:hover{background:#F9F8F4;}
  .search-result-item .sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  #undoToast{position:fixed;left:16px;right:16px;bottom:80px;z-index:95;max-width:420px;margin:0 auto;
    background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:14px;box-shadow:var(--shadow-md);transform:translateY(20px);opacity:0;
    pointer-events:none;transition:transform .25s ease, opacity .25s ease;font-size:13px;}
  #undoToast.show{transform:translateY(0);opacity:1;pointer-events:auto;}
  #undoToast button{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;flex-shrink:0;}
  .cat-indicator-row{margin-bottom:16px;position:relative;}
  .cat-indicator{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;
    background:var(--accent);border:none;font-size:13.5px;font-weight:700;color:#fff;box-shadow:var(--shadow-sm);transition:.15s;}
  .cat-indicator:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .cat-indicator .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#fff !important;}
  .cat-indicator .caret{font-size:11px;margin-left:2px;}
  .cat-add{padding:8px 14px;background:none;border:1.5px dashed var(--border);border-radius:999px;font-size:12.5px;color:var(--ink-soft);}

  #categorySheet{position:absolute;left:0;top:calc(100% + 8px);background:var(--surface);border-radius:18px;
    z-index:61;padding:10px;box-shadow:var(--shadow-md);min-width:200px;
    transform:translateY(-6px);opacity:0;pointer-events:none;transition:transform .18s ease, opacity .18s ease;max-height:60vh;overflow-y:auto;}
  #categorySheet.open{transform:translateY(0);opacity:1;pointer-events:auto;}
  .sheet-title{font-size:11px;font-weight:700;color:var(--ink-soft);margin:4px 8px 8px;}
  .category-option{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;background:none;
    border:none;border-radius:12px;font-size:14px;font-weight:700;color:var(--ink);text-align:left;}
  .category-option:hover{background:#F1F0EA;}
  .category-option .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .category-option.active{color:var(--accent);background:var(--accent-soft);}

  .main{padding:26px 26px 90px;max-width:960px;margin:0 auto;}

  #bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1.5px solid var(--border);
    display:flex;z-index:22;box-shadow:0 -4px 16px rgba(0,0,0,.05);padding:6px 10px calc(6px + env(safe-area-inset-bottom));}
  .bottom-nav-indicator{position:absolute;top:6px;bottom:6px;background:var(--accent-soft);border-radius:16px;
    transition:left .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);z-index:0;left:0;width:0;}
  .bottom-nav-item{position:relative;z-index:1;flex:1;background:none;border:none;padding:11px 4px;border-radius:16px;color:var(--ink-soft);transition:color .15s;display:flex;align-items:center;justify-content:center;}
  .bottom-nav-item.active{color:var(--accent);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .seg{display:flex;position:relative;gap:24px;border:none;overflow:visible;border-bottom:2px solid var(--border);}
  .seg button{padding:8px 4px 10px;border:none;background:none;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .seg button.active{color:var(--accent);}
  .btn-primary{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:999px;font-size:13.5px;font-weight:700;
    box-shadow:var(--shadow-sm);transition:.15s;}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .btn-ghost{background:#fff;border:1.5px solid var(--border);padding:9px 18px;border-radius:999px;font-size:12.5px;color:var(--ink-soft);transition:.15s;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

  /* ============ TASK LIST ============ */
  .task{border:1.5px solid var(--border);border-radius:18px;margin-bottom:12px;background:#FDFDFB;box-shadow:var(--shadow-sm);overflow:hidden;transition:.15s;}
  .task:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .task.done{opacity:.7;}
  .task-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:15px 16px;}
  .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;flex-shrink:0;position:relative;transition:.15s;}
  @keyframes checkBounce{0%{transform:scale(1);} 40%{transform:scale(1.35);} 70%{transform:scale(.88);} 100%{transform:scale(1);}}
  .check.bounce{animation:checkBounce .4s ease;}
  @keyframes streakMilestone{
    0%{box-shadow:0 0 0 0 rgba(242,169,59,.7);}
    60%{box-shadow:0 0 0 10px rgba(242,169,59,0);}
    100%{box-shadow:0 0 0 0 rgba(242,169,59,0);}
  }
  .streak-badge.milestone{animation:streakMilestone .9s ease-out;}
  .check:disabled{opacity:.35;cursor:not-allowed;}
  .check.done{background:var(--accent);border-color:var(--accent);}
  .check.done::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg);}
  .task-title{font-weight:700;font-size:14px;flex:1 1 90px;min-width:90px;}
  .task.done .task-title{color:var(--ink-soft);text-decoration:line-through;}
  .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .time-chip{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;background:#F1F0EA;padding:3px 9px;border-radius:999px;flex-shrink:0;}
  .overdue-tag{font-size:11px;color:#fff;font-weight:700;white-space:nowrap;background:var(--danger);padding:3px 9px;border-radius:999px;flex-shrink:0;}
  .text-btn{background:none;border:none;color:var(--ink-soft);font-size:12px;padding:5px 10px;border-radius:999px;flex-shrink:0;}
  .note-btn.has-note{color:var(--accent);font-weight:700;}
  .note-preview{font-size:12px;color:var(--ink-soft);background:#F9F8F4;border-radius:10px;padding:7px 12px;margin:0 0 4px 34px;white-space:pre-wrap;word-break:break-word;}
  .text-btn:hover{color:var(--accent);background:var(--accent-soft);}
  .expand-arrow{background:none;border:none;color:var(--ink-soft);width:26px;height:26px;border-radius:50%;
    flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;transition:.15s;}
  .expand-arrow:hover{color:var(--accent);background:var(--accent-soft);}
  .expand-arrow .arrow-glyph{display:inline-block;transition:transform .15s;}
  .expand-arrow.expanded .arrow-glyph{transform:rotate(90deg);}
  .progress-chip{font-size:10.5px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:700;flex-shrink:0;}
  .subtasks{padding:4px 16px 14px 48px;background:#F9F8F4;}
  .subtask-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 0;border-top:1px dotted var(--border);}
  .subtask-title{flex:1 1 70px;font-size:13px;min-width:70px;}
  .subtask-row.done .subtask-title{color:var(--ink-soft);text-decoration:line-through;}
  .reminder-toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);}
  .add-sub-btn{margin-top:8px;background:var(--accent-soft);border:none;color:var(--accent);font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13.5px;}

  /* ============ CALENDAR / WEEK ============ */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-nav-btn{background:#fff;border:1.5px solid var(--border);width:32px;height:32px;border-radius:50%;font-size:13px;box-shadow:var(--shadow-sm);}
  .cal-title{font-size:14.5px;font-weight:700;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;padding:6px 0;}
  .cal-cell{min-height:74px;padding:6px;font-size:11.5px;background:#FDFDFB;border:1.5px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.15s;position:relative;}
  .cal-cell:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .cal-lunar{font-size:9px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-lunar.festival{color:var(--danger);font-weight:700;}
  .cal-lunar.holiday-day{color:var(--danger);}
  .cal-holiday-tag{position:absolute;top:4px;right:4px;font-size:8px;color:#fff;background:var(--danger);
    border-radius:5px;padding:0 3px;line-height:1.4;}
  .cal-cell.pad{background:transparent;border-color:transparent;color:#D8D8D8;}
  .cal-cell.selected{background:var(--accent-soft);border-color:var(--accent);}
  .cal-cell .num{display:inline-flex;align-items:center;justify-content:center;}
  .cal-cell.today .num{font-weight:700;color:#fff;background:var(--accent);width:20px;height:20px;border-radius:50%;}
  .cal-dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;}
  .cal-dots span{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .day-detail{margin-top:20px;border-top:1.5px solid var(--border);padding-top:16px;}
  .day-detail h3{font-size:13.5px;margin:0 0 10px;}
  .item-line{font-size:12.5px;padding:9px 12px;border-radius:12px;background:#FDFDFB;border:1.5px solid var(--border);border-left:4px solid var(--border);margin-bottom:6px;}
  .item-line .t{color:var(--ink-soft);margin-right:8px;}

  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .week-col{background:#FDFDFB;border:1.5px solid var(--border);border-radius:16px;padding:9px;min-height:150px;box-shadow:var(--shadow-sm);transition:.15s;}
  .week-col:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .week-col-head{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;display:flex;
    align-items:center;justify-content:space-between;gap:6px;padding:2px 2px 2px 4px;border-radius:10px;}
  .week-col-head.today{color:var(--accent);}
  .week-col-head.clickable{cursor:pointer;}
  .week-col-head.clickable:hover{background:#F1F0EA;}
  .week-col-date{white-space:nowrap;}
  .week-mood-face{width:20px;height:20px;flex-shrink:0;border-radius:6px;}
  .week-mood-add{width:20px;height:20px;flex-shrink:0;border-radius:6px;border:1.5px dashed var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);}
  .week-item{font-size:11px;border-radius:10px;border-left:3px solid var(--border);padding:6px 8px;margin-bottom:6px;background:#F1F0EA;}
  .week-item .t{color:var(--ink-soft);display:block;font-size:10px;}
  .no-item{font-size:11px;color:#D8D8D8;text-align:center;padding-top:14px;}

  .setting-block{margin-bottom:30px;max-width:640px;}
  .setting-block h3{font-size:13px;margin:0 0 12px;color:var(--ink-soft);font-weight:700;}
  .palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
  .palette-card{border:1.5px solid var(--border);border-radius:16px;padding:11px;background:#fff;text-align:left;box-shadow:var(--shadow-sm);transition:.15s;}
  .palette-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .palette-card.selected{outline:2.5px solid var(--accent);outline-offset:2px;}
  .palette-card.add-card{display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12.5px;min-height:60px;border-style:dashed;box-shadow:none;}
  .palette-swatch{display:flex;height:24px;border-radius:8px;overflow:hidden;margin-bottom:8px;}
  .palette-swatch span{flex:1;}
  .palette-name{font-size:11.5px;font-weight:700;}
  .cat-palette-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:#FDFDFB;border:1.5px solid var(--border);font-size:13px;margin-bottom:8px;}

  .habit-week-strip{margin-bottom:18px;}
  .habit-week-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;}
  .habit-week-arrow{background:#F1F0EA;border:none;width:26px;height:26px;border-radius:50%;font-size:14px;color:var(--ink-soft);}
  .habit-week-arrow:disabled{opacity:.35;}
  .habit-week-range{font-size:11.5px;color:var(--ink-soft);font-weight:700;min-width:80px;text-align:center;}
  .habit-week-days{display:flex;justify-content:space-between;gap:4px;}
  .habit-day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:16px;background:none;border:none;flex:1;transition:.15s;}
  .habit-day:hover{background:#F1F0EA;}
  .habit-day .dow{font-size:11px;color:var(--ink-soft);}
  .habit-day .num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);transition:.15s;}
  .habit-day.today .dow{color:var(--accent);font-weight:700;}
  .habit-day.selected .num{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .habit-day:disabled{opacity:.35;cursor:not-allowed;}
  .habit-day:disabled:hover{background:none;}

  .pill-tabs{display:inline-flex;background:#F1F0EA;border-radius:999px;padding:4px;gap:2px;}
  .pill-tab{padding:9px 20px;border:none;background:none;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-soft);transition:.15s;}
  .pill-tab.active{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}

  .habit-summary{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .habit-table{display:flex;flex-direction:column;gap:10px;}
  .habit-grid-row{display:grid;grid-template-columns:40px 1fr 128px;align-items:stretch;background:#FDFDFB;border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease;}
  .habit-grid-row:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .habit-grid-num{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--ink-soft);padding:6px 2px;}
  .drag-handle{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;padding:8px 6px;background:none;border:none;cursor:grab;touch-action:none;}
  .drag-handle span{width:14px;height:2px;background:var(--ink-soft);border-radius:1px;display:block;}
  .habit-grid-row.habit-drag-ghost{position:fixed;pointer-events:none;z-index:200;box-shadow:var(--shadow-md);opacity:.95;}
  .habit-grid-name{padding:14px 8px 14px 0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0;}
  .habit-grid-name.checked{color:var(--ink-soft);}
  .habit-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .habit-name-col{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .habit-name-col .del-link{align-self:flex-start;padding:0;font-size:10.5px;color:#C7C3B8;background:none;border:none;}
  .habit-grid-check{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#F1F0EA;padding:10px 6px;}
  .streak-badge{font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:700;}
  .habit-value-input{width:64px;padding:6px 4px;border:1.5px solid var(--border);border-radius:10px;font-size:12px;text-align:center;font-family:inherit;}
  .habit-value-input[type=time]{width:100px;padding:6px 2px;}
  .habit-value-input:disabled{opacity:.4;cursor:not-allowed;background:#F1F0EA;}
  .habit-unit-label{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

  .habit-stats-card{border:1.5px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px;background:#FDFDFB;box-shadow:var(--shadow-sm);}
  .habit-stats-card h4{margin:0 0 12px;font-size:13.5px;}
  .rate-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .rate-label{width:52px;font-size:11.5px;color:var(--ink-soft);flex-shrink:0;}
  .rate-bar-track{flex:1;height:8px;background:var(--border);border-radius:999px;overflow:hidden;}
  .rate-bar-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .8s cubic-bezier(.22,1,.36,1);}
  .chart-line-draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 1.1s ease-out forwards;}
  @keyframes drawLine{to{stroke-dashoffset:0;}}
  .chart-dot{opacity:0;animation:dotAppear .3s ease forwards;}
  @keyframes dotAppear{to{opacity:1;}}

    64.75%{transform:rotate(7.6deg);box-shadow:3.0px 4.9px 9.8px rgba(0,0,0,.18);}
    69.42%{transform:rotate(-1.5deg);box-shadow:-0.6px 3.4px 6.8px rgba(0,0,0,.18);}
    71.22%{transform:rotate(1.2deg);box-shadow:0.5px 3.3px 6.6px rgba(0,0,0,.18);}
    75.9%{transform:rotate(-1.1deg);box-shadow:-0.4px 3.3px 6.5px rgba(0,0,0,.18);}
    77.7%{transform:rotate(6.9deg);box-shadow:2.8px 4.7px 9.4px rgba(0,0,0,.18);}
    82.37%{transform:rotate(-1.3deg);box-shadow:-0.5px 3.3px 6.7px rgba(0,0,0,.18);}
    84.17%{transform:rotate(7.6deg);box-shadow:3.0px 4.9px 9.8px rgba(0,0,0,.18);}
    88.85%{transform:rotate(-2.1deg);box-shadow:-0.8px 3.5px 7.0px rgba(0,0,0,.18);}
    90.65%{transform:rotate(3.8deg);box-shadow:1.5px 4.0px 7.9px rgba(0,0,0,.18);}
    95.32%{transform:rotate(-1.2deg);box-shadow:-0.5px 3.3px 6.6px rgba(0,0,0,.18);}
    100.0%{transform:rotate(-1.7deg);box-shadow:-0.7px 3.4px 6.8px rgba(0,0,0,.18);}
  }  .quicknote-text{white-space:pre-wrap;word-break:break-word;margin-bottom:10px;line-height:1.5;}
  .quicknote-time{font-size:10px;color:rgba(0,0,0,.4);padding-right:38px;}
  .quicknote-del{position:absolute;top:2px;right:6px;background:none;border:none;font-size:15px;color:rgba(0,0,0,.3);}
  .quicknote-pin{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:11px;height:11px;
    border-radius:50%;background:#D4D4CF;
    box-shadow:0 1px 2px rgba(0,0,0,.3);z-index:3;}
  .quicknote-move{position:absolute;bottom:4px;right:6px;background:rgba(0,0,0,.08);border:none;font-size:9.5px;
    color:rgba(0,0,0,.5);padding:2px 7px;border-radius:999px;}
  #quickNoteInputBar{position:fixed;left:16px;right:16px;bottom:76px;z-index:15;background:var(--surface);
    border:1.5px solid var(--border);padding:10px;display:flex;gap:10px;border-radius:20px;box-shadow:var(--shadow-md);
    max-width:600px;margin:0 auto;}
  #quickNoteInput{flex:1;border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;font-size:14px;
    font-family:inherit;resize:none;max-height:120px;}
  #quickNoteAnimLayer{display:none;position:fixed;inset:0;z-index:90;align-items:center;justify-content:center;
    transition:opacity .4s ease;}
  #quickNoteAnimLayer.show{display:flex;opacity:1;}
  #quickNoteAnimLayer.fading-out{opacity:0;}
  .quicknote-flying{width:140px;padding:14px;background:#FFF3B0;box-shadow:var(--shadow-md);border-radius:4px;
    font-size:13px;white-space:pre-wrap;word-break:break-word;transform:scale(1.3) rotate(0deg);
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .5s;}
  .quicknote-flying.landed{transform:scale(0.85) rotate(-4deg) translateY(140px);opacity:.9;}
  @keyframes quicknoteAppear{from{opacity:0;} to{opacity:1;}}
  #quickNoteLeafLayer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
  .quicknote-leaf{position:absolute;right:-30px;animation:leafDrift linear forwards;pointer-events:auto;cursor:grab;}
  @keyframes leafDrift{
    0%{transform:translate(0,0) rotate(0deg);opacity:0;}
    8%{opacity:.85;}
    92%{opacity:.85;}
    100%{transform:translate(var(--dx,120vw),var(--dy,80px)) rotate(var(--drot,380deg));opacity:0;}
  }

  /* ============ 今天總結（夜間）／每日提醒（早晨） ============ */
  #nightRecapOverlay{display:none;position:fixed;inset:0;z-index:160;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#1B2333,#0B0F17);overflow:hidden;transition:opacity 1s ease;}
  #nightRecapOverlay.show{display:flex;opacity:1;}
  #nightRecapOverlay.fading-out{opacity:0;}
  .recap-stars{position:absolute;inset:0;pointer-events:none;}
  .recap-star{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);}
  .recap-star.s1{top:12%;left:18%;animation:starDrift1 7s ease-in-out infinite;}
  .recap-star.s2{top:22%;left:78%;width:3px;height:3px;animation:starDrift2 9s ease-in-out infinite;}
  .recap-star.s3{top:68%;left:12%;width:4px;height:4px;animation:starDrift2 8s ease-in-out infinite;}
  .recap-star.s4{top:78%;left:82%;animation:starDrift1 10s ease-in-out infinite;}
  .recap-star.s5{top:40%;left:50%;width:3px;height:3px;animation:starDrift1 6s ease-in-out infinite;}
  @keyframes starDrift1{0%,100%{transform:translate(0,0);opacity:.4;} 50%{transform:translate(8px,-14px);opacity:1;}}
  @keyframes starDrift2{0%,100%{transform:translate(0,0);opacity:.5;} 50%{transform:translate(-10px,10px);opacity:1;}}
  @keyframes recapCardIn{from{opacity:0;transform:translateY(46px) scale(.92);} to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes recapFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);}}
  .recap-card{position:relative;background:#FDFDFB;border-radius:26px;padding:30px 26px;max-width:360px;width:88%;
    box-shadow:0 30px 80px rgba(0,0,0,.5);animation:recapCardIn .8s cubic-bezier(.22,1,.36,1) both, recapFloat 5.5s ease-in-out .8s infinite;
    transition:opacity 1s ease;overflow:hidden;}
  .recap-card.fade-out-card{opacity:0;}
  .recap-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--ink-soft);}
  .recap-title{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center;}
  .recap-next-btn{width:100%;margin-top:18px;}
  .recap-step{transition:opacity 1s ease;}
  .recap-step.fade-out{opacity:0;}
  .recap-step.fade-in-init{opacity:0;}
  .mood-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px;}
  .mood-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:#F1F0EA;border:2px solid transparent;
    border-radius:16px;padding:14px 16px;font-size:12px;color:var(--ink-soft);font-weight:700;transition:.15s;}
  @keyframes moodBounce{0%{transform:scale(1);} 45%{transform:scale(1.18);} 75%{transform:scale(.94);} 100%{transform:scale(1);}}
  .mood-btn.bounce{animation:moodBounce .35s ease;}
  .mood-btn.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
  .mood-face{width:38px;height:38px;display:block;}
  #recapNoteInput{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:14px;font-size:13.5px;
    font-family:inherit;resize:none;}

  #recapGoodnightScreen{display:none;position:absolute;inset:0;z-index:5;flex-direction:column;align-items:center;
    justify-content:center;opacity:0;transition:opacity 1s ease;cursor:pointer;overflow:hidden;}
  #recapGoodnightScreen.show{display:flex;opacity:1;}
  .goodnight-sky{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .goodnight-moon-svg{position:absolute;top:9%;left:14%;width:50px;height:50px;
    filter:drop-shadow(0 0 16px rgba(245,240,224,.6));animation:recapFloat 6s ease-in-out infinite;}
  .goodnight-twinkle{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;
    animation:twinkle 3s ease-in-out infinite;}
  .goodnight-twinkle.t1{top:10%;left:22%;animation-delay:0s;}
  .goodnight-twinkle.t2{top:15%;left:68%;width:3px;height:3px;animation-delay:.6s;}
  .goodnight-twinkle.t3{top:26%;left:82%;animation-delay:1.2s;}
  .goodnight-twinkle.t4{top:7%;left:47%;width:3px;height:3px;animation-delay:1.8s;}
  .goodnight-twinkle.t5{top:33%;left:10%;animation-delay:2.2s;}
  .goodnight-twinkle.t6{top:19%;left:36%;width:3px;height:3px;animation-delay:.3s;}
  .goodnight-twinkle.t7{top:38%;left:58%;animation-delay:1.5s;}
  .goodnight-twinkle.t8{top:12%;left:90%;width:3px;height:3px;animation-delay:2.6s;}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7);} 50%{opacity:1;transform:scale(1.3);}}
  .goodnight-shootingstar{position:absolute;width:60px;height:2px;border-radius:2px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9));
    opacity:0;transform:rotate(-20deg) translateX(0);animation:shootingStar 6s linear infinite;}
  .goodnight-shootingstar.ss1{top:14%;left:6%;animation-delay:1.5s;}
  .goodnight-shootingstar.ss2{top:28%;left:52%;animation-delay:4.5s;}
  @keyframes shootingStar{
    0%{opacity:0;transform:rotate(-20deg) translateX(0);}
    3%{opacity:1;}
    16%{opacity:0;transform:rotate(-20deg) translateX(150px);}
    100%{opacity:0;transform:rotate(-20deg) translateX(150px);}
  }
  .goodnight-mountains{position:absolute;left:0;bottom:0;width:100%;height:33%;z-index:1;}
  .goodnight-text{position:relative;z-index:2;color:#fff;font-size:19px;font-weight:700;text-align:center;line-height:1.8;
    text-shadow:0 2px 16px rgba(0,0,0,.6);padding:0 30px;animation:recapFloat 5.5s ease-in-out .3s infinite;}

  #dailyBriefOverlay{display:none;position:fixed;inset:0;z-index:150;align-items:center;justify-content:center;
    background:rgba(0,0,0,.35);overflow:hidden;transition:opacity .5s ease;padding:20px;}
  #dailyBriefOverlay.show{display:flex;opacity:1;}
  #dailyBriefOverlay.fading-out{opacity:0;}
  .sky-layer{position:absolute;inset:0;z-index:-1;}
  .sky-layer.day{background:linear-gradient(180deg,#E3F2FD,#90CAF9);}
  .sky-layer.white{background:#FFFFFF;opacity:0;}
  .sky-layer.morning{background:linear-gradient(180deg,#FBE3B8,#F3A768);opacity:1;}
  #dailyBriefOverlay.plain-mode .sky-layer{display:none;}
  #dailyBriefOverlay.sky-cycle .sky-layer.morning{animation:morningFadeOut 10s ease both;}
  #dailyBriefOverlay.sky-cycle .sky-layer.white{animation:whiteFadeInOut 10s ease both;}
  @keyframes morningFadeOut{0%{opacity:1;} 100%{opacity:0;}}
  @keyframes whiteFadeInOut{0%{opacity:0;} 50%{opacity:1;} 100%{opacity:0;}}

  #morningGreetingScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 30px;cursor:pointer;transition:opacity .5s ease;}
  #morningGreetingScreen.fade-out{opacity:0;}
  .sunrise-mountains{position:absolute;left:0;bottom:0;width:100%;height:33%;z-index:1;}
  .morning-sun-el{position:absolute;left:50%;margin-left:-55px;width:110px;height:110px;border-radius:50%;
    background:#FFD873;filter:drop-shadow(0 0 30px rgba(255,216,115,.9));
    top:80%;z-index:0;
    animation:sunRiseNew 10s cubic-bezier(.25,.1,.25,1) both, recapFloat 6s ease-in-out 10s infinite;}
  @keyframes sunRiseNew{from{top:80%;} to{top:25%;}}
  .morning-text{position:relative;z-index:2;color:#fff;font-size:22px;font-weight:700;line-height:1.8;
    text-shadow:0 2px 14px rgba(0,0,0,.35);animation:recapFloat 5.5s ease-in-out .3s infinite;}

  .daily-brief-modal{max-width:340px;opacity:0;transition:opacity .5s ease;}
  .daily-brief-modal.show-card{opacity:1;}
  .brief-section{margin-bottom:14px;}
  .brief-label{font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .brief-item{font-size:13.5px;padding:8px 0;border-bottom:1px dotted var(--border);}
  .brief-empty{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:20px 0;}

  /* ============ MODAL ============ */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150;align-items:center;justify-content:center;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:24px;padding:28px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 18px;font-size:16px;}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .field input,.field select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:14px;font-size:13.5px;font-family:inherit;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;}
  .row-inline{display:flex;align-items:center;justify-content:space-between;}
  .switch{position:relative;width:38px;height:22px;background:#DDD;border-radius:999px;border:none;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch.disabled{opacity:.4;}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s;box-shadow:var(--shadow-sm);}
  .switch.on::after{left:18px;}

  @media(max-width:820px){
    .top-bar{padding:12px 16px;}
    .main{padding:18px 16px 90px;}
    .cal-cell{min-height:58px;}
    .week-grid{grid-template-columns:1fr;gap:10px;}
    .week-col{min-height:auto;}
    .week-col-head{text-align:left;margin-bottom:8px;}
  }
  /* ============ BOOKMARKS ============ */
  .bm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .bm-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:14px;position:relative;box-shadow:var(--shadow-sm);transition:.15s;}
  .bm-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .bm-card a{text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;}
  .bm-card img{width:18px;height:18px;flex-shrink:0;border-radius:4px;}
  .bm-title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bm-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--ink-soft);font-size:11px;}
  .bm-add-card{background:#fff;border:1.5px dashed var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12.5px;min-height:50px;}
</style>

<body>

<!-- ================= 登入 → 第一層分類浮現 ================= -->
<div id="blackScreen">
  <div class="stage show" id="stageLogin">
    <div class="login-anim"><span></span><span></span><span></span></div>
    <h1>記事簿</h1>
    <div class="login-note" id="authCheckingNote">正在確認登入狀態...</div>
    <div id="gsiButtonContainer" style="display:none;justify-content:center;align-items:center;min-height:44px;margin-bottom:2px;">
      <div class="login-anim" id="gsiLoadingAnim" style="margin:0;"><span></span><span></span><span></span></div>
    </div>
    <div class="login-note" id="loginNote" style="display:none">Google 登入元件載入失敗，請檢查網路連線後重新整理頁面。</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appShell">
  <div class="top-bar">
    <div class="brand">記事簿</div>
    <button class="search-trigger-btn" onclick="openSearch()" title="搜尋">
      <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="main">
    <div class="cat-indicator-row" id="catIndicatorRow">
      <button class="cat-indicator" id="catIndicator" onclick="toggleCategorySheet()">
        <span class="sw" id="catIndicatorDot"></span>
        <span id="catIndicatorLabel">總覽</span>
        <span class="caret">▾</span>
      </button>
      <div id="categorySheet">
        <div class="sheet-title">切換分類</div>
        <div id="categorySheetList"></div>
        <button class="cat-add" onclick="closeCategorySheet(); openCatModal();">＋新增分類</button>
      </div>
    </div>
    <div class="toolbar" id="sharedToolbar">
      <div class="seg" id="filterSeg">
        <button id="pendingBtn" data-f="pending" onclick="setListFilter('pending')">待處理</button>
        <button id="doneFilterBtn" data-f="done" onclick="setListFilter('done')">已完成</button>
      </div>
      <button class="btn-primary" id="addTaskBtn" onclick="openTaskModal()">＋ 新增事項</button>
    </div>


    <!-- 清單 -->
    <div id="view-list">
      <div id="taskList"></div>
    </div>

    <!-- 月曆 -->
    <div id="view-cal" style="display:none"></div>

    <!-- 週曆 -->
    <div id="view-week" style="display:none"></div>

    <!-- 習慣（總覽專屬） -->
    <div id="view-habits" style="display:none">
      <div class="habit-week-strip" id="habitWeekStrip"></div>
      <div class="toolbar" style="margin-bottom:16px;">
        <div class="pill-tabs" id="habitTabSeg">
          <button id="habitCheckinBtn" class="pill-tab active" onclick="setHabitTab('checkin')">打卡</button>
          <button id="habitStatsBtn" class="pill-tab" onclick="setHabitTab('stats')">統計</button>

        <button class="btn-primary" onclick="openHabitModal()">＋ 新增習慣</button>

      <div id="habitCheckinView"></div>
      <div id="habitStatsView" style="display:none"></div>
    </div>

    <!-- 隨手記 -->
    <div id="view-quicknotes" style="display:none">

      <div id="quickNoteWall"></div>
      <div id="quickNoteInputBar">
        <textarea id="quickNoteInput" placeholder="隨手記點什麼..." rows="1"></textarea>
        <button class="btn-primary" onclick="sendQuickNote()">傳送</button>
      </div>
      <div id="quickNoteAnimLayer"></div>
      <div id="quickNoteLeafLayer"></div>
    </div>

    <!-- 設定 -->
    <div id="view-settings" style="display:none">
      <div class="setting-block">
        <h3>帳戶</h3>
        <div class="side-account" style="border-top:none;padding-top:0;">
          <div class="name" id="accName">-</div>
          <div class="mail" id="accEmail"></div>
          <button class="side-logout" onclick="logout()">登出／切換帳號</button>
        </div>
      </div>
      <div class="setting-block">
        <h3>推播通知</h3>
        <div class="row-inline" style="max-width:300px;">
          <label style="margin:0;font-size:13px;">背景推播提醒（App沒開也會響）</label>
          <button class="switch" id="pushSwitch" onclick="togglePushSwitch()"></button>
        </div>
      </div>
      <div class="setting-block">
        <h3>每日提醒</h3>
        <div class="row-inline" style="max-width:340px;">
          <label style="margin:0;font-size:13px;">今天顯示每日提醒</label>
          <div style="display:flex;align-items:center;gap:10px;">
            <button class="text-btn" style="padding:4px 10px;color:var(--accent);font-weight:700;" onclick="viewDailyBriefNow()">查看</button>
            <button class="switch" id="dailyBriefSwitch" onclick="toggleDailyBriefSwitch()"></button>
          </div>
        </div>
        <div class="row-inline" style="max-width:300px;margin-top:10px;">
          <label style="margin:0;font-size:13px;">每次登入都顯示早安動畫</label>
          <button class="switch" id="morningGreetingSwitch" onclick="toggleMorningGreetingSwitch()"></button>
        </div>
      </div>
      <div class="setting-block">
        <h3>回顧小結</h3>
        <button class="btn-ghost" onclick="openSummary('week')">本週小結</button>
        <button class="btn-ghost" style="margin-left:8px;" onclick="openSummary('month')">本月小結</button>
      </div>
      <div class="setting-block">
        <h3>書籤</h3>
        <div class="bm-grid" id="bmGrid"></div>
      </div>
      <div class="setting-block">
        <h3>整體配色風格</h3>
        <div class="palette-grid" id="paletteGrid"></div>
      </div>
      <div class="setting-block">
        <h3>各分類專屬配色（可個別指定，不設定則跟隨整體）</h3>
        <div id="categoryPaletteList"></div>
      </div>
      <button class="btn-ghost" onclick="resetTheme()">重設為預設外觀</button>
      <button class="btn-ghost" style="margin-left:8px;color:var(--danger);border-color:var(--danger)" onclick="clearAllDataConfirm()">清除所有資料</button>
    </div>
  </div>
</div>

<!-- ================= 底部導覽列 ================= -->
<div id="bottomNav">
  <span class="bottom-nav-indicator" id="bottomNavIndicator"></span>
  <button class="bottom-nav-item" data-view="habits" title="習慣" onclick="switchMainView('habits')">
    <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

const LUNAR_GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const LUNAR_ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const LUNAR_NSTR1=['日','一','二','三','四','五','六','七','八','九','十'];
const LUNAR_NSTR2=['初','十','廿','卅'];
const LUNAR_NSTR3=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const SOLAR_MONTH_DAYS=[31,28,31,30,31,30,31,31,30,31,30,31];

function lunarLeapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function lunarLeapDays(y){ return lunarLeapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29) : 0; }
function lunarMonthDays(y,m){ return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29; }
function lunarYearDays(y){
  let sum = 348;
  for(let i=0x8000; i>0x8; i>>=1){ sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0; }
  return sum + lunarLeapDays(y);
}
function toChinaMonth(m){ return LUNAR_NSTR3[m-1] + '月'; }
function toChinaDay(d){
  if(d===10) return '初十';
  if(d===20) return '二十';
  if(d===30) return '三十';
  return LUNAR_NSTR2[Math.floor(d/10)] + LUNAR_NSTR1[d%10];
}
function toGanZhiYear(lYear){
  let ganKey=(lYear-3)%10, zhiKey=(lYear-3)%12;
  if(ganKey===0) ganKey=10; if(zhiKey===0) zhiKey=12;
  return LUNAR_GAN[ganKey-1]+LUNAR_ZHI[zhiKey-1];
}
function solar2lunar(y,m,d){
  if(y<1900||y>2100) return null;
  const objDate = new Date(y, m-1, d);
  let offset = Math.round((Date.UTC(objDate.getFullYear(),objDate.getMonth(),objDate.getDate()) - Date.UTC(1900,0,31))/86400000);
  let i, temp=0;
  for(i=1900; i<2101 && offset>0; i++){ temp = lunarYearDays(i); offset -= temp; }
  if(offset<0){ offset += temp; i--; }
  const year = i;
  const leap = lunarLeapMonth(i);
  let isLeap = false;
  for(i=1; i<13 && offset>0; i++){
    if(leap>0 && i===(leap+1) && !isLeap){ --i; isLeap=true; temp=lunarLeapDays(year); }
    else{ temp = lunarMonthDays(year, i); }
    if(isLeap && i===(leap+1)) isLeap=false;
    offset -= temp;
  }
  if(offset===0 && leap>0 && i===leap+1){
    if(isLeap){ isLeap=false; } else { isLeap=true; --i; }
  }
  if(offset<0){ offset += temp; --i; }
  const month = i, day = offset+1;
  return { lYear:year, lMonth:month, lDay:day, isLeap, ganZhiYear: toGanZhiYear(year) };
}
function lunarDisplay(y,m,d){
  const l = solar2lunar(y,m,d);
  if(!l) return {text:'', festival:null};
  const fest = lunarFestival(l.lMonth, l.lDay, l.isLeap);
  let text = l.lDay===1 ? (l.isLeap?'閏':'')+toChinaMonth(l.lMonth) : toChinaDay(l.lDay);
  return { lunar:l, text, festival: fest };
}
function lunarFestival(m,d,isLeap){
  if(isLeap) return null;
  const map = {'1-1':'春節','1-15':'元宵節','2-2':'龍抬頭','5-5':'端午節','7-7':'七夕','7-15':'中元節',
    '8-15':'中秋節','9-9':'重陽節','12-8':'臘八節'};
  return map[m+'-'+d] || null;
}
function isLunarNewYearEve(y,m,d){
  const next = new Date(y,m-1,d+1);
  const ln = solar2lunar(next.getFullYear(), next.getMonth()+1, next.getDate());
  return !!(ln && ln.lMonth===1 && ln.lDay===1 && !ln.isLeap);
}
function solarFestival(m,d){
  const map = {'1-1':'元旦','2-14':'情人節','2-28':'和平紀念日','3-8':'婦女節','3-12':'植樹節',
    '4-4':'兒童節','5-1':'勞動節','9-28':'教師節','10-10':'國慶日','10-25':'光復節',
    '11-12':'國父誕辰','12-25':'行憲紀念日'};
  return map[m+'-'+d] || null;
}
const TW_HOLIDAY_SOLAR = {'1-1':true,'2-28':true,'4-4':true,'5-1':true,'10-10':true};
function getDayInfo(y,m,d){
  const lunar = lunarDisplay(y,m,d);
  const sFest = solarFestival(m,d);
  const isEve = isLunarNewYearEve(y,m,d);
  const lFestRaw = lunar.festival;
  const lFest = isEve ? '除夕' : lFestRaw;
  const festival = sFest || lFest;
  let holiday = !!TW_HOLIDAY_SOLAR[m+'-'+d];
  if(isEve || lFest==='春節' || lFest==='端午節' || lFest==='中秋節') holiday = true;
  const dow = new Date(y,m-1,d).getDay();
  return { lunarText: lunar.text, festival, holiday, isWeekend: (dow===0||dow===6) };
}

async function loadData(storageKey){
  const res = await storageGet(storageKey);
  data = res ? JSON.parse(res.value) : defaultData();
  delete data.theme;
  if(!data.globalPaletteId) data.globalPaletteId = 'p01';
  if(!data.customPalettes) data.customPalettes = [];
  if(!data.tasks) data.tasks = [];
  if(!data.habits) data.habits = [];
  if(!data.habitLogs) data.habitLogs = {};
  if(!data.quickNotes) data.quickNotes = [];
  if(!data.dayRecaps) data.dayRecaps = {};
  if(data.lastAutoRecapDate===undefined) data.lastAutoRecapDate = null;
  if(data.morningGreetingAlwaysOn===undefined) data.morningGreetingAlwaysOn = false;
  if(data.morningGreetingShownDate===undefined) data.morningGreetingShownDate = null;
  data.categories.forEach(c=>{ if(c.paletteId===undefined) c.paletteId = null; });
  if(!data.categories.find(c=>c.id==='work')) data.categories.unshift({id:'work', name:'工作', color:'#2E4057', deletable:false, paletteId:null});
  if(!data.categories.find(c=>c.id==='personal')) data.categories.unshift({id:'personal', name:'私人', color:'#7A5C82', deletable:false, paletteId:null});
  data.habits.forEach(h=>{ if(!h.type) h.type = 'boolean'; if(h.unit===undefined) h.unit = ''; });
  Object.keys(data.habitLogs).forEach(hid=>{
    const log = data.habitLogs[hid];
    if(Array.isArray(log)){
      const obj = {};
      log.forEach(d=> obj[d] = {value:true, checked:true});
      data.habitLogs[hid] = obj;
    }else{
      Object.keys(log).forEach(day=>{
        const entry = log[day];
        if(entry===null || typeof entry !== 'object'){
          log[day] = {value: entry, checked: !!(entry!==undefined && entry!==null && entry!=='' && entry!==false)};
        }
      });
    }
  });
  lastPersistedCount = totalContentCount(data);
  lastPersistedCounts = categoryCounts(data);
}

function totalContentCount(d){
  if(!d) return 0;
  return (d.tasks?d.tasks.length:0) + (d.habits?d.habits.length:0) + (d.quickNotes?d.quickNotes.length:0) + (d.dayRecaps?Object.keys(d.dayRecaps).length:0);
}
function categoryCounts(d){
  if(!d) return {tasks:0, habits:0, quickNotes:0, dayRecaps:0};
  return {
    tasks: d.tasks ? d.tasks.length : 0,
    habits: d.habits ? d.habits.length : 0,
    quickNotes: d.quickNotes ? d.quickNotes.length : 0,
    dayRecaps: d.dayRecaps ? Object.keys(d.dayRecaps).length : 0
  };
}

let saveTimer=null;
let lastWrittenValue = null;
let lastPersistedCount = null;
let lastPersistedCounts = {tasks:0, habits:0, quickNotes:0, dayRecaps:0};
function persist(){
  clearTimeout(saveTimer);
  const keyAtScheduleTime = currentStorageKey;
  const dataAtScheduleTime = data;
  saveTimer = setTimeout(async ()=>{
    if(!keyAtScheduleTime || !dataAtScheduleTime) return;
    const cats = categoryCounts(dataAtScheduleTime);
    const currentCount = cats.tasks + cats.habits + cats.quickNotes + cats.dayRecaps;
    const fullWipe = (currentCount===0 && lastPersistedCount!==null && lastPersistedCount>3);
    const categoryWiped = Object.keys(cats).some(k=> cats[k]===0 && lastPersistedCounts[k]>3);
    const severeDrop = (lastPersistedCount!==null && lastPersistedCount>3 && currentCount < lastPersistedCount*0.5);
    if(fullWipe || categoryWiped || severeDrop){
      const reason = fullWipe ? '總數瞬間全部清空' : categoryWiped ? '某個分類瞬間全部清空' : '總數驟降超過一半';
      console.error('偵測到異常(' + reason + '):', lastPersistedCounts, '->', cats, ',已阻止此次自動儲存以保護雲端資料,重新從雲端讀取確認狀態');
      notify('偵測到資料異常，已暫停自動儲存以保護你的紀錄');
      try{
        await loadData(keyAtScheduleTime);
        refreshCurrentView();
      }catch(e){ console.error('保護機制重新讀取失敗', e); }
      return;
    }
    const json = JSON.stringify(dataAtScheduleTime);
    lastWrittenValue = json;
    const ok = await storageSet(keyAtScheduleTime, json);
    if(ok){
      lastPersistedCount = currentCount;
      lastPersistedCounts = cats;
      maybeBackupHistory(keyAtScheduleTime, json);
    }
    else console.error('儲存失敗');
  }, 250);
}

      value: jsonValue, backedUpAt: Date.now()

function base64UrlDecode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length % 4) str += '=';
  return decodeURIComponent(atob(str).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

      const payload = JSON.parse(base64UrlDecode(response.credential.split('.')[1]));
      await proceedLogin(payload.name || payload.email, payload.email, keyFor(payload.email));
      enterAppDirectly();
    }
  }catch(e){
    console.error('Google 登入失敗', e);
    notify('Google 登入失敗，請重新嘗試。');
  }
}

async function proceedLogin(name, email, storageKey){
  currentEmail = email;
  currentStorageKey = storageKey || keyFor(email);
  try{
    await loadData(currentStorageKey);
  }catch(e){
    console.error('讀取雲端資料失敗,為避免覆蓋資料已中止登入', e);
    currentEmail = null;
    currentStorageKey = null;
    data = null;
    notify('讀取資料失敗，請檢查網路連線後重新登入，避免資料被覆蓋。');
    throw e;
  }
  startRealtimeSync(currentStorageKey);
  document.getElementById('accName').textContent = name;
  document.getElementById('accEmail').textContent = email;
}

function categoryOf(id){ return data.categories.find(c=>c.id===id); }

function visibleTasks(filterMode){
  let list = data.tasks;
  if(ui.catId !== 'overview') list = list.filter(t=>t.categoryId===ui.catId);
  if(filterMode==='pending') list = list.filter(t=>t.status!=='done');
  if(filterMode==='done') list = list.filter(t=>t.status==='done');
  return list;
}

function fmtTime(t){
  if(!t) return '未排定';
  const d = new Date(t);
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDate(d){
  if(!d) return '未排定';
  const dt = new Date(d+'T00:00');
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}
function isOverdueDate(dueDate, status){
  if(!dueDate || status==='done') return false;
  return new Date(dueDate+'T23:59:59').getTime() < Date.now();
}
function isOverdueTime(time, status){
  if(!time || status==='done') return false;
  return new Date(time).getTime() < Date.now();
}

function buildTaskHtml(list){
  if(list.length===0){
    return `<div class="empty-state">目前沒有事項</div>`;
  }
  return list.map(t=>{
    const cat = categoryOf(t.categoryId);
    const subs = t.subtasks||[];
    const doneSub = subs.filter(s=>s.status==='done').length;
    const expanded = ui.expanded[t.id] !== false;
    const taskOverdue = isOverdueDate(t.dueDate, t.status);
    return `
    <div class="task ${t.status==='done'?'done':''}">
      <div class="task-row">
        <button class="check ${t.status==='done'?'done':''}" data-check-id="task:${t.id}" onclick="toggleTask('${t.id}')"></button>
        ${ui.catId==='overview' && cat ? `<span class="cat-dot" style="background:${cat.color}"></span>`:''}
        <span class="task-title">${escapeHtml(t.title)}</span>
        ${subs.length? `<span class="progress-chip">${doneSub}/${subs.length}</span>`:''}
        ${t.dueDate? `<span class="${taskOverdue?'overdue-tag':'time-chip'}">${taskOverdue?'延誤 ':''}${fmtDate(t.dueDate)}</span>`:''}
        <button class="expand-arrow ${expanded?'expanded':''}" onclick="toggleExpand('${t.id}')"><span class="arrow-glyph">▸</span></button>
        <button class="text-btn note-btn ${t.note?'has-note':''}" onclick="openNoteModal('task','${t.id}')">備註</button>
        <button class="text-btn" onclick="openTaskModal('${t.id}')">編輯</button>
        <button class="text-btn" onclick="deleteTask('${t.id}')">刪除</button>
      </div>
      ${t.note? `<div class="note-preview">${escapeHtml(t.note)}</div>`:''}
      ${expanded? `
      <div class="subtasks">
        ${subs.map(s=>{
          const subOverdue = isOverdueTime(s.time, s.status);
          return `
          <div class="subtask-row ${s.status==='done'?'done':''}">
            <button class="check ${s.status==='done'?'done':''}" style="width:15px;height:15px" data-check-id="sub:${t.id}:${s.id}" onclick="toggleSubtask('${t.id}','${s.id}')"></button>
            <span class="subtask-title">${escapeHtml(s.title)}</span>
            <span class="${subOverdue?'overdue-tag':'time-chip'}">${subOverdue?'延誤 ':''}${fmtTime(s.time)}</span>
            <span class="reminder-toggle">提醒<button class="switch ${s.reminder?'on':''}" onclick="toggleReminder('${t.id}','${s.id}')"></button></span>
            <button class="text-btn note-btn ${s.note?'has-note':''}" onclick="openNoteModal('subtask','${t.id}','${s.id}')">備註</button>
            <button class="text-btn" onclick="openSubModal('${t.id}','${s.id}')">編輯</button>
            <button class="text-btn" onclick="deleteSubtask('${t.id}','${s.id}')">刪除</button>
          </div>
          ${s.note? `<div class="note-preview" style="margin-left:23px;">${escapeHtml(s.note)}</div>`:''}
        `;}).join('')}
        <button class="add-sub-btn" onclick="openSubModal('${t.id}')">＋ 新增細項</button>
      </div>`:''}
    </div>`;
  }).join('');
}

      data.tasks.splice(idx,0,removed);

  });
}
function deleteSubtask(tid,sid){
  const t = data.tasks.find(x=>x.id===tid);
  const idx = t.subtasks.findIndex(s=>s.id===sid);
  const removed = t.subtasks[idx];
  t.subtasks.splice(idx,1);
  renderTaskList();
  deleteReminderDoc(sid);
  showUndoToast('已刪除「'+removed.title+'」', ()=>{
    t.subtasks.splice(idx,0,removed);
    if(removed.reminder && removed.time) writeReminderDoc(sid, removed.title, t.title, new Date(removed.time).getTime());
  }, renderTaskList);
}
function toggleReminder(tid,sid){
  const t = data.tasks.find(x=>x.id===tid);
  const s = t.subtasks.find(x=>x.id===sid);
  if(!s.reminder && 'Notification' in window && Notification.permission!=='granted'){
    Notification.requestPermission();
  }
  s.reminder = !s.reminder;
  if(s.reminder){
    scheduleReminder(t, s);
    if(s.time) writeReminderDoc(sid, s.title, t.title, new Date(s.time).getTime());
  }else{
    deleteReminderDoc(sid);
  }
  persist(); refreshAll();
}
function scheduleReminder(task, sub){
  if(!sub.time) return;
  const ms = new Date(sub.time).getTime() - Date.now();
  if(ms<=0 || ms > 24*60*60*1000*7) return;
  setTimeout(()=>{
    if(!sub.reminder) return;
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('提醒：'+sub.title, {body: task.title+'（'+fmtTime(sub.time)+'）', icon:'icon-192.png', badge:'icon-notification.png'});
    }else{
      notify('提醒：'+sub.title);
    }
  }, ms);
}

const habitReminderTimers = {};
function scheduleHabitReminders(){
  Object.values(habitReminderTimers).forEach(t=> clearTimeout(t));
  data.habits.forEach(h=>{
    if(!h.remindTime) return;
    const [hh,mm] = h.remindTime.split(':').map(Number);
    const target = new Date();
    target.setHours(hh, mm, 0, 0);
    let ms = target.getTime() - Date.now();
    if(ms<0) ms += 24*60*60*1000;
    habitReminderTimers[h.id] = setTimeout(()=>{
      if(!habitHasLog(h, todayStr())){
        if('Notification' in window && Notification.permission==='granted'){
          new Notification('習慣提醒：'+h.name, {body:'今天還沒打卡喔', icon:'icon-192.png', badge:'icon-notification.png'});
        }else{
          notify('習慣提醒：'+h.name+'（今天還沒打卡）');
        }
      }
      scheduleHabitReminders();
    }, ms);
  });
}

let editingTaskId = null;
let noteTarget = null;
function openSearch(){
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchOverlay').classList.add('show');
  document.getElementById('searchInput').focus();
}
function closeSearch(){
  document.getElementById('searchOverlay').classList.remove('show');
}
function performSearch(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const box = document.getElementById('searchResults');
  if(!q){ box.innerHTML = ''; return; }

  const taskHits = [];
  const subHits = [];
  data.tasks.forEach(t=>{
    if(t.title.toLowerCase().includes(q) || (t.note||'').toLowerCase().includes(q)){
      taskHits.push(t);
    }
    (t.subtasks||[]).forEach(s=>{
      if(s.title.toLowerCase().includes(q) || (s.note||'').toLowerCase().includes(q)){
        subHits.push({task:t, sub:s});
      }
    });
  });
  const noteHits = data.quickNotes.filter(n=> n.text.toLowerCase().includes(q));
  const habitHits = data.habits.filter(h=> h.name.toLowerCase().includes(q));

  if(taskHits.length+subHits.length+noteHits.length+habitHits.length===0){
    box.innerHTML = `<div class="empty-state">找不到符合「${escapeHtml(q)}」的內容</div>`;
    return;
  }
  let html = '';
  if(taskHits.length){
    html += `<div class="search-result-group"><div class="search-result-label">事項</div>` +
      taskHits.map(t=>`<div class="search-result-item" onclick="jumpToTask('${t.categoryId}','${t.id}')">${escapeHtml(t.title)}${t.note?`<div class="sub">${escapeHtml(t.note)}</div>`:''}</div>`).join('') + `</div>`;
  }
  if(subHits.length){
    html += `<div class="search-result-group"><div class="search-result-label">細項</div>` +
      subHits.map(x=>`<div class="search-result-item" onclick="jumpToTask('${x.task.categoryId}','${x.task.id}')">${escapeHtml(x.sub.title)}<div class="sub">來自：${escapeHtml(x.task.title)}</div></div>`).join('') + `</div>`;
  }
  if(noteHits.length){
    html += `<div class="search-result-group"><div class="search-result-label">隨手記</div>` +
      noteHits.map(n=>`<div class="search-result-item" onclick="jumpToQuickNotes()">${escapeHtml(n.text.slice(0,60))}</div>`).join('') + `</div>`;
  }
  if(habitHits.length){
    html += `<div class="search-result-group"><div class="search-result-label">習慣</div>` +
      habitHits.map(h=>`<div class="search-result-item" onclick="jumpToHabits()">${escapeHtml(h.name)}</div>`).join('') + `</div>`;
  }
  box.innerHTML = html;
}

let undoTimer = null;

  clearTimeout(undoTimer);
  if(undoState) persist();
  document.getElementById('undoToastMsg').textContent = message;
  document.getElementById('undoToast').classList.add('show');
  undoState = { restoreFn, refreshFn };
  undoTimer = setTimeout(()=>{
    document.getElementById('undoToast').classList.remove('show');
    undoState = null;
    persist();
  }, 5000);
}
function clickUndo(){
  if(!undoState) return;
  clearTimeout(undoTimer);
  document.getElementById('undoToast').classList.remove('show');
  undoState.restoreFn();

  undoState = null;
}

function allTimedItems(){
  let items = [];
  const src = ui.catId==='overview' ? data.tasks : data.tasks.filter(t=>t.categoryId===ui.catId);
  src.forEach(t=>{
    const cat = categoryOf(t.categoryId);
    if(t.dueDate) items.push({title:t.title, time:t.dueDate+'T00:00', color:cat?cat.color:'#999', status:t.status, isDate:true});
    (t.subtasks||[]).forEach(s=>{
      if(s.time) items.push({title:s.title, time:s.time, color:cat?cat.color:'#999', status:s.status, parent:t.title});
    });
  });
  if(ui.filter==='pending') items = items.filter(i=>i.status!=='done');
  if(ui.filter==='done') items = items.filter(i=>i.status==='done');
  return items;
}

function renderCalendar(){
  const el = document.getElementById('view-cal');
  const y = ui.calDate.getFullYear(), m = ui.calDate.getMonth();
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const items = allTimedItems();
  const today = new Date();
  const isSameDay=(a,b)=> a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();

  let cells='';
  for(let i=0;i<startOffset;i++) cells+=`<div class="cal-cell pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const cellDate = new Date(y,m,d);
    const dayItems = items.filter(it=> isSameDay(new Date(it.time), cellDate));
    const colors = [...new Set(dayItems.map(i=>i.color))].slice(0,4);
    const isToday = isSameDay(cellDate, today);
    const isSel = ui.selectedDate && isSameDay(cellDate, ui.selectedDate);
    const info = getDayInfo(y, m+1, d);
    const lunarLabel = info.festival || info.lunarText;
    const lunarClass = info.festival ? 'cal-lunar festival' : (info.holiday ? 'cal-lunar holiday-day' : 'cal-lunar');
    cells += `<div class="cal-cell ${isSel?'selected':''} ${isToday?'today':''}" onclick="selectDate(${y},${m},${d})">
      <div class="num">${d}</div>
      <div class="${lunarClass}">${escapeHtml(lunarLabel)}</div>
      ${info.holiday? '<div class="cal-holiday-tag">休</div>' : ''}
      <div class="cal-dots">${colors.map(c=>`<span style="background:${c}"></span>`).join('')}</div>
    </div>`;
  }

  el.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="cal-title">${y}年 ${m+1}月</div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div style="font-size:10.5px;color:var(--ink-soft);margin-top:10px;">農曆與節日僅供參考，國定假日以政府公告為準</div>
    <div class="day-detail" id="dayDetail"></div>
  `;
  renderDayDetail();
}

function renderWeek(){
  const el = document.getElementById('view-week');
  const base = new Date(ui.weekDate);
  const start = new Date(base); start.setDate(base.getDate()-base.getDay());
  const items = allTimedItems();
  const today = new Date();
  const dows=['日','一','二','三','四','五','六'];
  const pad=n=>String(n).padStart(2,'0');
  let cols='';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const dayItems = items.filter(it=>{
      const t=new Date(it.time);
      return t.getFullYear()===d.getFullYear()&&t.getMonth()===d.getMonth()&&t.getDate()===d.getDate();
    }).sort((a,b)=>a.time.localeCompare(b.time));
    const isToday = d.toDateString()===today.toDateString();
    const dayStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const isPastOrToday = dayStr <= todayStr();
    const recap = (data.dayRecaps || {})[dayStr];
    let recapIndicator = '';
    if(isPastOrToday){
      recapIndicator = recap ? moodFaceSvgSmall(recap.mood) : `<span class="week-mood-add">＋</span>`;
    }
    cols += `<div class="week-col">
      <div class="week-col-head ${isToday?'today':''} ${isPastOrToday?'clickable':''}" ${isPastOrToday?`onclick="openRecapFromWeek('${dayStr}')"`:''}>
        <span class="week-col-date">${dows[i]} ${d.getMonth()+1}/${d.getDate()}</span>
        ${recapIndicator}
      </div>
      ${dayItems.length? dayItems.map(it=>`<div class="week-item" style="border-left-color:${it.color}"><span class="t">${it.isDate? '截止' : fmtTime(it.time).split(' ')[1]}</span>${escapeHtml(it.title)}</div>`).join('') : `<div class="no-item">無事項</div>`}
    </div>`;
  }
  const endLabel = new Date(start); endLabel.setDate(start.getDate()+6);
  el.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeWeek(-1)">‹</button>
      <div class="cal-title">${start.getMonth()+1}/${start.getDate()} - ${endLabel.getMonth()+1}/${endLabel.getDate()}</div>
      <button class="cal-nav-btn" onclick="changeWeek(1)">›</button>
    </div>
    <div class="week-grid">${cols}</div>
  `;
}
function changeWeek(delta){ ui.weekDate = new Date(ui.weekDate.getTime() + delta*7*24*60*60*1000); renderWeek(); }

let habitDragCtx = null;
function habitHandlePointerDown(e, habitId){
  if(e.pointerType==='mouse' && e.button!==0) return;
  const rowEl = e.currentTarget.closest('.habit-grid-row');
  const startX = e.clientX, startY = e.clientY;
  const pressTimer = setTimeout(()=>{
    document.removeEventListener('pointermove', cancelWatch);
    document.removeEventListener('pointerup', cancelUp);
    startHabitDrag(habitId, rowEl, e);
  }, 380);
  function cancelWatch(ev){
    if(Math.abs(ev.clientY-startY)>10 || Math.abs(ev.clientX-startX)>10){
      clearTimeout(pressTimer);
      document.removeEventListener('pointermove', cancelWatch);
      document.removeEventListener('pointerup', cancelUp);
    }
  }
  function cancelUp(){
    clearTimeout(pressTimer);
    document.removeEventListener('pointermove', cancelWatch);
    document.removeEventListener('pointerup', cancelUp);
  }
  document.addEventListener('pointermove', cancelWatch);
  document.addEventListener('pointerup', cancelUp);
}
function startHabitDrag(habitId, rowEl, e){
  const rect = rowEl.getBoundingClientRect();
  const ghost = rowEl.cloneNode(true);
  ghost.classList.add('habit-drag-ghost');
  ghost.style.top = rect.top+'px';
  ghost.style.left = rect.left+'px';
  ghost.style.width = rect.width+'px';
  document.body.appendChild(ghost);
  rowEl.style.visibility = 'hidden';
  habitDragCtx = { rowEl, ghost, grabOffsetY: e.clientY - rect.top };
  if(navigator.vibrate) navigator.vibrate(12);
  document.addEventListener('pointermove', onHabitDragMove);
  document.addEventListener('pointerup', onHabitDragEnd);
}
function onHabitDragMove(e){
  if(!habitDragCtx) return;
  e.preventDefault();
  habitDragCtx.ghost.style.top = (e.clientY - habitDragCtx.grabOffsetY) + 'px';
  const container = habitDragCtx.rowEl.parentElement;
  const rows = Array.from(container.querySelectorAll('.habit-grid-row')).filter(r=> r!==habitDragCtx.rowEl);
  let targetRow = null, insertBefore = true;
  for(const r of rows){
    const rr = r.getBoundingClientRect();
    const rCenter = rr.top + rr.height/2;
    if(e.clientY < rCenter){ targetRow = r; insertBefore = true; break; }
  }
  if(!targetRow && rows.length>0){ targetRow = rows[rows.length-1]; insertBefore = false; }
  if(targetRow){
    if(insertBefore) container.insertBefore(habitDragCtx.rowEl, targetRow);
    else container.insertBefore(habitDragCtx.rowEl, targetRow.nextSibling);
  }
}
function onHabitDragEnd(){
  if(!habitDragCtx) return;
  document.removeEventListener('pointermove', onHabitDragMove);
  document.removeEventListener('pointerup', onHabitDragEnd);
  habitDragCtx.ghost.remove();
  const container = habitDragCtx.rowEl.parentElement;
  const newOrderIds = Array.from(container.querySelectorAll('.habit-grid-row')).map(r=> r.dataset.habitId);
  const reordered = newOrderIds.map(id=> data.habits.find(h=>h.id===id)).filter(Boolean);
  if(reordered.length === data.habits.length) data.habits = reordered;
  habitDragCtx = null;
  persist();
  renderHabitCheckin();
}
function habitEntry(h, day){
  return (data.habitLogs[h.id]||{})[day] || null;
}
function habitHasLog(h, day){
  const entry = habitEntry(h, day);
  return !!(entry && entry.checked);
}
function isFutureDay(day){ return day > todayStr(); }
function setHabitBoolean(id, day){
  if(isFutureDay(day)) return;
  if(!data.habitLogs[id]) data.habitLogs[id] = {};
  const cur = data.habitLogs[id][day];
  const nowChecked = !(cur && cur.checked);
  data.habitLogs[id][day] = nowChecked ? {value:true, checked:true} : {value:true, checked:false};
  persist(); renderHabitCheckin();
  if(nowChecked){
    bounceCheck(`habit:${id}:${day}`);
    const h = data.habits.find(x=>x.id===id);
    if(h && [7,30,100,365].includes(habitStreak(h))) flashMilestone(id);
  }
}
function setHabitChecked(id, day){
  if(isFutureDay(day)) return;
  if(!data.habitLogs[id]) data.habitLogs[id] = {};
  const cur = data.habitLogs[id][day] || {value:undefined, checked:false};
  const nowChecked = !cur.checked;
  cur.checked = nowChecked;
  data.habitLogs[id][day] = cur;
  persist(); renderHabitCheckin();
  if(nowChecked){
    bounceCheck(`habit:${id}:${day}`);
    const h = data.habits.find(x=>x.id===id);
    if(h && [7,30,100,365].includes(habitStreak(h))) flashMilestone(id);
  }
}
function setHabitValue(id, day, rawValue, type){
  if(isFutureDay(day)) return;
  if(!data.habitLogs[id]) data.habitLogs[id] = {};
  let justChecked = false;
  if(rawValue===''){
    delete data.habitLogs[id][day];
  }else if(type==='quantity'){
    const num = parseFloat(rawValue);
    if(!isNaN(num)){ data.habitLogs[id][day] = {value:num, checked:true}; justChecked = true; }
  }else{
    data.habitLogs[id][day] = {value:rawValue, checked:true};
    justChecked = true;
  }
  persist(); renderHabitCheckin();
  if(justChecked){
    bounceCheck(`habit:${id}:${day}`);
    const h = data.habits.find(x=>x.id===id);
    if(h && [7,30,100,365].includes(habitStreak(h))) flashMilestone(id);
  }
}
function changeHabitWeek(delta){
  ui.habitWeekOffset = Math.min(0, (ui.habitWeekOffset||0) + delta);
  renderHabitWeekStrip();
}
function selectHabitDate(day){
  ui.habitDate = day;

function renderHabitWeekStrip(){
  if(!ui.habitDate) ui.habitDate = todayStr();
  if(!ui.habitWeekOffset) ui.habitWeekOffset = 0;
  const box = document.getElementById('habitWeekStrip');
  const today = todayStr();
  const dows = ['日','一','二','三','四','五','六'];
  const base = new Date();
  base.setDate(base.getDate() + ui.habitWeekOffset*7);
  const start = new Date(base); start.setDate(base.getDate()-base.getDay());
  const end = new Date(start); end.setDate(start.getDate()+6);
  let html = `<div class="habit-week-nav">
    <button class="habit-week-arrow" onclick="changeHabitWeek(-1)">‹</button>
    <span class="habit-week-range">${start.getMonth()+1}/${start.getDate()} - ${end.getMonth()+1}/${end.getDate()}</span>
    <button class="habit-week-arrow" ${ui.habitWeekOffset>=0?'disabled':''} onclick="changeHabitWeek(1)">›</button>
  </div><div class="habit-week-days">`;
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const pad=n=>String(n).padStart(2,'0');
    const dayStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const isToday = dayStr===today;
    const isSelected = dayStr===ui.habitDate;
    html += `<button class="habit-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectHabitDate('${dayStr}')">
      <span class="dow">${dows[i]}</span>
      <span class="num">${d.getDate()}</span>
    </button>`;
  }
  html += `</div>`;
  box.innerHTML = html;
}
function habitStreak(h){
  let streak = 0, i = 0;
  while(habitHasLog(h, dateStrOffset(-i))){ streak++; i++; }
  return streak;
}
function renderHabitCheckin(){
  if(!ui.habitDate) ui.habitDate = todayStr();
  renderHabitWeekStrip();
  const box = document.getElementById('habitCheckinView');
  if(data.habits.length===0){
    box.innerHTML = `<div class="empty-state">還沒有任何習慣，點右上角「＋新增習慣」開始每天打卡</div>`;
    return;
  }
  const day = ui.habitDate;
  const future = isFutureDay(day);
  const doneCount = data.habits.filter(h=> habitHasLog(h, day)).length;
  const dateLabel = day===todayStr() ? '今日' : day.slice(5).replace('-','/');
  let html = `<div class="habit-summary">${dateLabel}已完成 ${doneCount} / ${data.habits.length} 項習慣${future?'（未來日期尚無法勾選）':''}</div>`;
  html += `<div class="habit-table">` + data.habits.map((h,idx)=>{
    const entry = habitEntry(h, day);
    const val = entry ? entry.value : undefined;

function habitEarliestDate(h){
  const logDates = Object.keys(data.habitLogs[h.id]||{}).filter(d=> habitHasLog(h,d));
  let earliest = h.createdAt || todayStr();
  logDates.forEach(d=>{ if(d < earliest) earliest = d; });
  return earliest;
}
function habitRate(h, days){
  let count = 0;
  for(let i=0;i<days;i++){
    if(habitHasLog(h, dateStrOffset(-i))) count++;
  }
  return Math.round((count/days)*100);
}
function habitRateAllTime(h){
  const created = new Date(habitEarliestDate(h)+'T00:00');
  const today = new Date(todayStr()+'T00:00');
  const totalDays = Math.max(1, Math.round((today-created)/86400000)+1);
  const count = Object.keys(data.habitLogs[h.id]||{}).filter(d=> habitHasLog(h,d)).length;
  return Math.round((count/totalDays)*100);
}
function timeToMinutes(t){ const parts=t.split(':'); return Number(parts[0])*60+Number(parts[1]); }
function minutesToTimeLabel(m){ const h=Math.floor(m/60), mm=Math.round(m%60); return String(((h%24)+24)%24).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function buildHabitLineChart(h){
  const hasAnyLog = Object.keys(data.habitLogs[h.id]||{}).some(d=> habitHasLog(h,d));
  if(!hasAnyLog){
    return `<div class="empty-state" style="padding:24px">尚無紀錄</div>`;
  }
  const days = [];
  const start = new Date(habitEarliestDate(h));
  const end = new Date(todayStr());
  const cursor = new Date(start);
  while(cursor <= end){
    const pad=n=>String(n).padStart(2,'0');
    days.push(`${cursor.getFullYear()}-${pad(cursor.getMonth()+1)}-${pad(cursor.getDate())}`);
    cursor.setDate(cursor.getDate()+1);
  }
  const pts = days.map(d=>{
    const entry = habitEntry(h, d);
    if(!entry || !entry.checked || entry.value===undefined || entry.value===''){ return 0; }
    const v = h.type==='time' ? timeToMinutes(entry.value) : Number(entry.value);
    return isNaN(v) ? 0 : v;
  });
  const validVals = pts;
  let min = Math.min(...validVals), max = Math.max(...validVals);
  if(min===max){ min -= 1; max += 1; }
  const W=560, H=150, padL=42, padR=12, padT=14, padB=22;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const stepX = days.length>1 ? innerW/(days.length-1) : 0;
  const scaleY = v => padT + innerH * (1 - (v-min)/(max-min));
  const dotR = days.length>60 ? 0 : days.length>30 ? 1.8 : 3.2;
  let segPts = [], allSegs = [];
  let dots = '';
  pts.forEach((v,i)=>{
    const x = padL + i*stepX;
    if(v===null){ if(segPts.length){ allSegs.push(segPts); segPts=[]; } return; }
    const y = scaleY(v);
    segPts.push({x, y});
    if(dotR>0){
      const dotDelay = (i/Math.max(days.length-1,1)) * 1.1;
      dots += `<circle class="chart-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dotR}" fill="var(--accent)" style="animation-delay:${dotDelay.toFixed(2)}s"></circle>`;
    }
  });
  if(segPts.length) allSegs.push(segPts);
  const smoothSegment = (p)=>{
    if(p.length===1) return '';
    if(p.length===2) return `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)} L${p[1].x.toFixed(1)},${p[1].y.toFixed(1)} `;
    let d = `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)} `;
    for(let i=0;i<p.length-1;i++){
      const p0 = p[i-1] || p[i];
      const p1 = p[i];
      const p2 = p[i+1];
      const p3 = p[i+2] || p2;
      const c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;
      const c2x = p2.x - (p3.x-p1.x)/6, c2y = p2.y - (p3.y-p1.y)/6;
      d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)} `;
    }
    return d;
  };
  const pathD = allSegs.map(smoothSegment).join(' ');
  const fmt = v => h.type==='time' ? minutesToTimeLabel(v) : (Math.round(v*10)/10) + (h.unit? ' '+h.unit : '');
  const xFirst = days[0].slice(5).replace('-','/');
  const xLast = days[days.length-1].slice(5).replace('-','/');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:150px;display:block;">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--border)" stroke-width="1"></line>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--border)" stroke-width="1"></line>
    <path d="${pathD}" pathLength="1000" class="chart-line-draw" fill="none" stroke="var(--accent)" stroke-width="2"></path>
    ${dots}
    <text x="2" y="${padT+4}" font-size="9" fill="var(--ink-soft)">${escapeHtml(String(fmt(max)))}</text>
    <text x="2" y="${H-padB}" font-size="9" fill="var(--ink-soft)">${escapeHtml(String(fmt(min)))}</text>
    <text x="${padL}" y="${H-4}" font-size="9" fill="var(--ink-soft)">${xFirst}</text>
    <text x="${W-padR-26}" y="${H-4}" font-size="9" fill="var(--ink-soft)">${xLast}</text>
  </svg>`;
}
